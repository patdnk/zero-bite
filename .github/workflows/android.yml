name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'testdata/**', 'shared-assets/**', 'scripts/check-polish-assets.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'testdata/**', 'shared-assets/**', 'scripts/check-polish-assets.py', '.github/workflows/android.yml']
  schedule:
    # Nightly at 2:30 AM UTC: catches runner image and emulator changes between commits.
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Android Lint for the app; checkPortable keeps JVM/Android-only imports out of :core.
      - name: Android Lint + core portability
        run: ./gradlew :app:lintDebug :core:checkPortable

      - name: Check the shared Polish assets
        working-directory: .
        run: python3 scripts/check-polish-assets.py

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # :core is plain JVM (JUnit 5, golden fixtures in /testdata); :app runs on Robolectric.
      - name: Run unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-unit-test-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [unit-tests]
    defaults:
      run:
        working-directory: android

    # The instrumented SmokeTest (app/src/androidTest) drives the debug app on an emulator:
    # welcome → add an item by hand → find it.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Hardware acceleration for the emulator on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build before booting the emulator so its boot timeout doesn't include the compile.
      - name: Build the app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-e2e-test-reports
          path: android/app/build/reports/androidTests/
          retention-days: 7
          if-no-files-found: ignore

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-tests]
    if: always()

    steps:
      - name: CI summary
        run: |
          echo "## Android CI results"
          echo "- Lint: ${{ needs.lint.result }}"
          echo "- Unit tests: ${{ needs.unit-tests.result }}"
          echo "- E2E tests: ${{ needs.e2e-tests.result }}"

          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed"
            exit 1
          fi

          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "❌ Unit tests failed"
            exit 1
          fi

          if [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "❌ E2E tests failed"
            exit 1
          fi

          echo "✅ CI passed!"

  nightly-notify:
    name: Report nightly failure
    runs-on: ubuntu-latest
    needs: [ci-summary]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write

    steps:
      - name: Create issue on nightly failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly Android CI failed - ${new Date().toISOString().split('T')[0]}`,
              body: `The nightly Android CI run has failed. See the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}).`,
              labels: ['ci']
            });
