name: iOS

on:
  push:
    branches: [main]
    paths: ['ios/**', 'testdata/**', 'shared-assets/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'testdata/**', 'shared-assets/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # The Xcode project is generated (and gitignored). GoogleService-Info.plist and Mona Sans are
      # gitignored too; the app skips Firebase and falls back to the system font without them.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # Runner images change their simulators over time, so take the newest iPhone available.
      - name: Pick a simulator
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          # Runtime keys look like ...SimRuntime.iOS-26-2, sometimes with a device suffix (-iPhone19-4).
          version = lambda k: [int(n) for n in re.match(r".*\.iOS-(\d+)-(\d+)", k).groups()]
          runtimes = sorted((k for k in devices if re.match(r".*\.iOS-\d+-\d+", k)), key=version)
          print(next(d["udid"] for k in reversed(runtimes) for d in devices[k] if d["name"].startswith("iPhone")))
          ')"
          echo "Testing on $(xcrun simctl list devices | grep "$UDID")"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme ZeroBite \
            -destination "id=$SIMULATOR_UDID" \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
          retention-days: 7
