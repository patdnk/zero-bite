name: ZeroBite
options:
  bundleIdPrefix: com.mazesys
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: NU6K42S2Q4
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.1.1
targets:
  ZeroBite:
    type: application
    platform: iOS
    sources:
      - path: ZeroBite
      - path: ../shared-assets/recipes.json
        buildPhase: resources
      - path: ../shared-assets/recipes.pl.json
        buildPhase: resources
      - path: ../shared-assets/recipe-tags.json
        buildPhase: resources
      - path: ../shared-assets/ingredient-aliases.pl.json
        buildPhase: resources
    dependencies:
      # Core leaves out the IDFA support and the Google Ads conversion SDK.
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
    info:
      path: ZeroBite/Info.plist
      properties:
        CFBundleDisplayName: Zero Bite
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Zero Bite uses the camera to read best-before dates and barcodes on food labels.
        ITSAppUsesNonExemptEncryption: false
        # Analytics without the advertising identifier: no ad tracking.
        GOOGLE_ANALYTICS_ADID_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_USER_DATA: false
        # Nothing is collected until the user agrees (Settings → Privacy or onboarding).
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        FirebaseCrashlyticsCollectionEnabled: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mazesys.zerobite
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        # Firebase finds Analytics at runtime by class name; without -ObjC the linker drops it.
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
  ZeroBiteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZeroBiteTests
      - path: ../testdata
        buildPhase: resources
    dependencies:
      - target: ZeroBite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mazesys.zerobite.tests
        GENERATE_INFOPLIST_FILE: YES
  # End-to-end: drives the real app in the simulator. CI runs it as its own job (-only-testing).
  ZeroBiteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ZeroBiteUITests
    dependencies:
      - target: ZeroBite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mazesys.zerobite.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ZeroBite:
    build:
      targets:
        ZeroBite: all
        ZeroBiteTests: [test]
        ZeroBiteUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZeroBiteTests
        - ZeroBiteUITests
    archive:
      config: Release
      postActions:
        # Build-phase scripts are sandboxed, so Crashlytics symbols go up after the archive instead.
        - name: Upload Crashlytics symbols
          settingsTarget: ZeroBite
          script: |
            GSP="${PROJECT_DIR}/ZeroBite/Resources/Firebase/GoogleService-Info.plist"
            [ -f "$GSP" ] || exit 0
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols" \
              -gsp "$GSP" -p ios "${ARCHIVE_DSYMS_PATH}" > "${ARCHIVE_PATH}/crashlytics-upload.log" 2>&1
